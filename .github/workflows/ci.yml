name: CI

on:
  push:
    branches:
      - main
      - studio
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - '3.12'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Qt headless runtime libs (Linux)
        if: runner.os == 'Linux'
        # PySide6 的 import 需要 EGL/GL 动态库,无头 runner 不带
        # (test_gui_workflow 在 import export_controller 时即
        # ImportError: libEGL.so.1)。
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # rawpy fork 走源码构建:runner 默认生成器换成 Ninja 后 LibRaw
          # 产物带 lib 前缀(libraw_r.dll),rawpy setup 只认 MSVC 命名
          # (raw_r.dll)。钉死 VS 生成器恢复旧命名。
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || '' }}

      - name: Use CPU onnxruntime for tests (Linux)
        if: runner.os == 'Linux'
        # 依赖声明在 linux 上装 onnxruntime-gpu(打包需要),但 CI runner
        # 无 CUDA,grade 融合会话起不来只能逐 op 回退,
        # test_grade_fused 的严格断言随之失败。测试环境换 CPU 构建,
        # 融合路径在 CPUExecutionProvider 上照常跑,覆盖率不缩水。
        run: |
          python -m pip uninstall -y onnxruntime-gpu
          python -m pip install onnxruntime

      - name: Run Ruff
        run: python -m ruff check

      - name: Run tests
        run: python -m pytest tests/ -x -q -p no:cacheprovider
