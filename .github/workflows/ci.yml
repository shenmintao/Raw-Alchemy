name: CI

on:
  push:
    branches:
      - main
      - studio
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # The pinned HE decoder build uses the stable VS 2022 toolchain.
          - windows-2022
          - macos-15
        python-version:
          - '3.12'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install build and Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        # PySide6 的 import 需要 EGL/GL 动态库,无头 runner 不带
        # (test_gui_workflow 在 import export_controller 时即
        # ImportError: libEGL.so.1)。
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake pkg-config libglib2.0-dev libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-sync1 libxrender1 libxi6 libsm6 libice6 xvfb

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: brew bundle --file=Brewfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake
          python tools/build_rawpy.py --install
          python -m pip install -r requirements.lock
          python -m pip install -e ".[test]"
          python tools/build_rawpy.py --verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Visual Studio 17 2022' || '' }}

      - name: Use CPU onnxruntime for tests (Linux)
        if: runner.os == 'Linux'
        # 依赖声明在 linux 上装 onnxruntime-gpu(打包需要),但 CI runner
        # 无 CUDA,grade 融合会话起不来只能逐 op 回退,
        # test_grade_fused 的严格断言随之失败。测试环境换 CPU 构建,
        # 融合路径在 CPUExecutionProvider 上照常跑,覆盖率不缩水。
        run: |
          python -m pip uninstall -y onnxruntime-gpu
          python -m pip install onnxruntime

      - name: Build platform wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir wheelhouse

      - name: Check installed wheel runtime
        shell: bash
        run: python tools/check_installed_wheel.py wheelhouse/*.whl

      - name: Run Ruff
        run: python -m ruff check

      - name: Check Nikon HE and HE star sensor samples
        run: python tools/check_nikon_he.py --download

      - name: Check Linux OpenGL viewport
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          python -c "from pathlib import Path; import PySide6, subprocess; subprocess.run(['ldd', str(Path(PySide6.__file__).parent / 'Qt/plugins/platforms/libqxcb.so')], check=True)"
          xvfb-run -a python tools/check_macos_opengl.py

      - name: Run tests
        # Hosted runners do not guarantee accelerator hardware. Native GPU
        # acceptance is recorded separately from this portable CPU baseline.
        env:
          QT_QPA_PLATFORM: offscreen
          RAW_ALCHEMY_CPU_ONLY: "1"
        run: python -m pytest tests/ -q -p no:cacheprovider --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
