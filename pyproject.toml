[build-system]
requires = ["setuptools>=61.0", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "raw_alchemy_studio"
version = "0.6.0"
description = "Raw Alchemy Studio - A fast culling/grading tool that applies cinematic LUTs to RAW photos with mathematical precision. Powered by Taichi Lang for GPU-accelerated image processing."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "rawpy @ git+https://github.com/shenmintao/rawpy.git",
    "numpy",
    "requests",
    "tifffile",
    "click",
    "colour-science @ git+https://github.com/colour-science/colour.git@develop",
    "scipy",
    "Pillow",
    "pillow-heif",
    "pyinstaller",
    "zstandard",
    "ordered-set",
    "taichi",
    "matplotlib",
    "PyOpenGL",
    "PySide6-Fluent-Widgets",
    "Send2Trash",
    "packaging",
    "loguru",
    "pyexiv2",
    "onnxruntime-gpu; sys_platform != 'darwin'",
    "onnxruntime; sys_platform == 'darwin'",
]

[project.urls]
"Homepage" = "https://github.com/shenmintao/raw-alchemy"
"Bug Tracker" = "https://github.com/shenmintao/raw-alchemy/issues"

[project.scripts]
raw-alchemy = "raw_alchemy.cli:main"
raw-alchemy-gui = "raw_alchemy.main:main"

[tool.setuptools.package-data]
raw_alchemy = [
    "locales/*.json",
    "vendor/*.dll",
    "vendor/cameras.xml",
    "vendor/*.onnx",
    "vendor/*.onnx.data",
    "vendor/lensfun/lib/*.dll",
    "vendor/lensfun/lib/*.so",
    "vendor/lensfun/lib/*.dylib",
    "vendor/lensfun/lib/*.lib",
    "vendor/lensfun/bin/*",
    "vendor/lensfun/share/lensfun/version_2/*.xml",
    "vendor/lensfun/include/lensfun/*.h",
]
